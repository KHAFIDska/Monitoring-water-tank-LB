<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bina Elektric</title>
  <link rel="stylesheet" href="style.css?v=1.1">
  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>

  <!-- Theme Toggle untuk Halaman Login -->
  <div style="position: absolute; top: 20px; right: 20px;">
    <button id="themeToggle" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
      <i data-feather="moon"></i>
    </button>
  </div>

  <main class="login-container">
    <div class="card login-card text-center">
      <div class="mb-3">
        <i data-feather="zap" style="color: var(--primary-color); width: 48px; height: 48px;"></i>
        <h2 class="mt-3">Bina Elektric</h2>
        <p>Masuk ke portal dasbor IoT Anda</p>
      </div>

      <div class="form-group text-left">
        <input type="email" id="email" placeholder="Alamat Email" required>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Kata Sandi" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()"
            aria-label="Toggle password visibility">
            <i id="eyeIcon" data-feather="eye"></i>
          </button>
        </div>
      </div>

      <!-- Captcha Section -->
      <div class="captcha-row">
        <canvas id="captchaCanvas" width="100" height="40" title="Klik untuk segarkan"></canvas>
        <input type="text" id="captchaInput" placeholder="Kode" required autocomplete="off">
        <button type="button" class="refresh-captcha icon-btn" onclick="generateCaptcha()" aria-label="Refresh Captcha">
          <i data-feather="refresh-cw" style="width: 16px; height: 16px;"></i>
        </button>
      </div>

      <button onclick="login()" class="mb-2 w-100">
        Masuk <i data-feather="log-in"></i>
      </button>

      <div id="loginMessage" style="display: none; margin-top: 15px;">
        <!-- Error or Info Message will appear here -->
      </div>

      <div class="mt-3">
        <p class="mb-1">Belum punya akun?</p>
        <button onclick="window.location.href='register.html'" class="btn-secondary">Daftar Akun Baru</button>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    feather.replace(); // Initialize icons

    // Theme logic
    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeIcon('dark');
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
      if (theme === 'dark') {
        themeToggleBtn.innerHTML = '<i data-feather="sun"></i>';
      } else {
        themeToggleBtn.innerHTML = '<i data-feather="moon"></i>';
      }
      feather.replace();
    }

    initTheme();

    // Password Toggle Logic
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('data-feather', 'eye-off');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('data-feather', 'eye');
      }
      feather.replace();
    }

    // Captcha Logic
    let currentCaptcha = "";
    function generateCaptcha() {
      const canvas = document.getElementById('captchaCanvas');
      const ctx = canvas.getContext('2d');
      // Karakter: Huruf, Angka, dan Simbol dasar
      const characters = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*';
      currentCaptcha = '';

      for (let i = 0; i < 3; i++) {
        currentCaptcha += characters.charAt(Math.floor(Math.random() * characters.length));
      }

      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw background noise
      ctx.fillStyle = "#f3f4f6";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 15; i++) {
        ctx.strokeStyle = `rgba(${Math.random() * 255},${Math.random() * 255},${Math.random() * 255}, 0.15)`;
        ctx.beginPath();
        ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.stroke();
      }

      // Draw text
      ctx.font = 'italic bold 26px "Georgia", serif'; // Menggunakan font serif agar elegan
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < currentCaptcha.length; i++) {
        const x = 20 + (i * 30);
        const y = 20 + (Math.random() * 6 - 3);
        const angle = (Math.random() * 0.3) - 0.15;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "#1e293b"; // Warna gelap elegan
        ctx.fillText(currentCaptcha[i], 0, 0);
        ctx.restore();
      }

      // Store captcha in window for app.js access
      window.captchaCode = currentCaptcha;
    }

    // Initialize Captcha on load
    window.addEventListener('DOMContentLoaded', generateCaptcha);
    document.getElementById('captchaCanvas').addEventListener('click', generateCaptcha);
  </script>
</body>

</html>

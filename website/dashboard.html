<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Monitoring water tank system</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>

<body>

  <nav class="navbar">
    <div class="brand">
      <i data-feather="zap" style="color: var(--primary-color);"></i>
      <h2>Monitoring Water tank system</h2>
    </div>
    <div class="nav-actions">
      <button id="themeToggle" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
        <i data-feather="moon"></i>
      </button>
      <div class="nav-profile-link" onclick="showMenu('profile')" style="cursor: pointer;">
        <img id="navProfilePic" src="https://ui-avatars.com/api/?name=User&background=3b82f6&color=fff" alt="Profile"
          class="profile-pic-nav">
      </div>
      <button onclick="logout()" class="btn-secondary btn-danger">
        <i data-feather="log-out"></i> <span>Logout</span>
      </button>
    </div>
  </nav>

  <main class="main-container">
    <aside class="sidebar">


      <button id="btn-menu1" class="menu-btn active" onclick="showMenu('menu1')">
        <i data-feather="droplet"></i> Volume Air
      </button>
      <button id="btn-menu2" class="menu-btn" onclick="showMenu('menu2')">
        <i data-feather="activity"></i> Tinggi Air
      </button>
      <button id="btn-laporan" class="menu-btn" onclick="showMenu('laporan')">
        <i data-feather="file-text"></i> Laporan & Log
      </button>
      <button id="btn-profile" class="menu-btn" onclick="showMenu('profile')">
        <i data-feather="user"></i> Profil Saya
      </button>
    </aside>

    <section class="content-area">
      <!-- Quick Stats Bar -->
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-icon">
            <i data-feather="rss"></i>
          </div>
          <div class="stat-info">
            <h4>Koneksi</h4>
            <p>Stabil</p>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">
            <i data-feather="cpu"></i>
          </div>
          <div class="stat-info">
            <h4>System</h4>
            <p><span class="pulse-dot"></span> Live</p>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">
            <i data-feather="clock"></i>
          </div>
          <div class="stat-info">
            <h4>Update</h4>
            <p id="lastUpdate">--:--</p>
          </div>
        </div>
      </div>

      <!-- MENU 1: Volume -->
      <div id="menu1" style="display: flex; flex-direction: column; width: 100%;">
        <div class="dashboard-grid">
          <div class="card dashboard-widget">
            <div class="mb-1">
              <i data-feather="activity" style="width: 32px; height: 32px; color: var(--primary-color);"></i>
            </div>
            <h3 class="data-label">Persentase Volume</h3>
            <div class="data-value glow-text" id="persen">0%</div>
            <div class="chart-container" style="width: 100%; height: 180px; margin-top: 1rem;">
              <canvas id="persenChart"></canvas>
            </div>
          </div>
          <div class="card dashboard-widget">
            <div class="mb-1">
              <i data-feather="pie-chart" style="width: 32px; height: 32px; color: var(--primary-color);"></i>
            </div>
            <h3 class="data-label">Total Air</h3>
            <div class="data-value glow-text" id="liter">0 L</div>
            <div class="chart-container" style="width: 100%; height: 180px; margin-top: 1rem;">
              <canvas id="literChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- MENU 2: Tinggi Air -->
      <div id="menu2" style="display:none; flex-direction: column; width: 100%;">
        <div class="dashboard-grid">
          <div class="card dashboard-widget">
            <div class="mb-1">
              <i data-feather="bar-chart-2" style="width: 32px; height: 32px; color: var(--primary-color);"></i>
            </div>
            <h3 class="data-label">Tinggi Permukaan</h3>
            <div class="data-value glow-text" id="tinggi">0 cm</div>
            <div class="chart-container" style="width: 100%; height: 180px; margin-top: 1rem;">
              <canvas id="tinggiChart"></canvas>
            </div>
          </div>
          <div class="card dashboard-widget">
            <div class="mb-3">
              <i data-feather="info" style="width: 48px; height: 48px; color: var(--primary-color);"></i>
            </div>
            <h3 class="data-label">Status Tangki</h3>
            <div class="status-badge" id="status"><span class="pulse-dot"></span> NORMAL</div>
          </div>
        </div>
      </div>

      <!-- REPORTS -->
      <div id="laporan" style="display:none; flex-direction: column; width: 100%;">
        <div class="card mb-3">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h3 class="data-label" style="margin: 0;">Riwayat Aktivitas Tangki</h3>
            <button onclick="exportToCSV()" class="btn-secondary" style="width: auto; padding: 10px 20px;">
              <i data-feather="download"></i> Ekspor CSV
            </button>
          </div>
          <div style="overflow-x: auto;">
            <table id="logTable" style="width: 100%; border-collapse: collapse; text-align: left;">
              <thead style="border-bottom: 2px solid var(--border-color);">
                <tr>
                  <th style="padding: 12px;">Waktu</th>
                  <th style="padding: 12px;">Volume (L)</th>
                  <th style="padding: 12px;">Persentase (%)</th>
                  <th style="padding: 12px;">Status</th>
                </tr>
              </thead>
              <tbody id="logBody">
                <!-- Data logs will be inserted here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- PROFILE -->
      <div id="profile" style="display:none; flex-direction: column; width: 100%;">
        <div class="dashboard-grid">
          <div class="card dashboard-widget" style="grid-column: 1 / -1;">
            <div class="mb-3" style="display: flex; justify-content: center;">
              <div class="profile-img-container large">
                <img id="mainProfilePic" src="https://ui-avatars.com/api/?name=User&background=3b82f6&color=fff"
                  alt="Profile" class="profile-pic">
                <label for="uploadPic" class="upload-btn" title="Ganti Foto">
                  <i data-feather="camera"></i>
                </label>
                <input type="file" id="uploadPic" name="uploadPic" accept="image/*" onchange="uploadProfilePic(this)"
                  style="position: absolute; width: 1px; height: 1px; opacity: 0;">
              </div>
            </div>
            <h3 class="data-label">Akun Pengguna</h3>
            <p id="emailUser" class="mt-3" style="font-size: 1.1rem; font-weight: 500;"></p>
            <p id="uploadStatus" style="font-size: 0.8rem; margin-top: 5px;"></p>

          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    feather.replace(); // Initialize icons

    // Theme Logic
    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeIcon('dark');
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
      if (theme === 'dark') {
        themeToggleBtn.innerHTML = '<i data-feather="sun"></i>';
      } else {
        themeToggleBtn.innerHTML = '<i data-feather="moon"></i>';
      }
      feather.replace();
    }

    initTheme();

    // EMAILJS INITIALIZATION
    // Ganti 'YOUR_PUBLIC_KEY' dengan Public Key dari dashboard EmailJS Anda!
    (function () {
      emailjs.init("DWXcCLZGE4uL8-SVF");
    })();

    const EMAIL_SERVICE_ID = "service_2i7lye4";
    const EMAIL_TEMPLATE_ID = "template_gtaw6em";
    let lastEmailSentTime = 0;
    const EMAIL_COOLDOWN = 30 * 60 * 1000; // 30 Menit Cooldown agar tidak spam

    // Firebase initialized via firebase-config.js


    // NAV MENU LOGIC
    function showMenu(menu) {
      document.getElementById("menu1").style.display = "none";
      document.getElementById("menu2").style.display = "none";
      document.getElementById("laporan").style.display = "none";
      document.getElementById("profile").style.display = "none";

      document.getElementById("btn-menu1").classList.remove("active");
      document.getElementById("btn-menu2").classList.remove("active");
      document.getElementById("btn-laporan").classList.remove("active");
      document.getElementById("btn-profile").classList.remove("active");

      document.getElementById(menu).style.display = "flex";
      document.getElementById("btn-" + menu).classList.add("active");
    }

    // LOGOUT
    function logout() {
      auth.signOut().then(() => {
        window.location = "index.html";
      });
    }

    // AUTH CHECK + PROFILE
    auth.onAuthStateChanged(user => {
      if (user) {
        const email = user.email;
        if (document.getElementById("emailUser")) document.getElementById("emailUser").innerText = email;

        // Load Profile Pic
        db.ref("users/" + user.uid + "/profilePic").on("value", snapshot => {
          const url = snapshot.val();
          const navPic = document.getElementById("navProfilePic");
          const mainPic = document.getElementById("mainProfilePic");

          if (url) {
            if (navPic) navPic.src = url;
            if (mainPic) mainPic.src = url;
          } else {
            const fallback = `https://ui-avatars.com/api/?name=${email}&background=3b82f6&color=fff`;
            if (navPic) navPic.src = fallback;
            if (mainPic) mainPic.src = fallback;
          }
        });
      } else {
        window.location = "index.html";
      }
    });

    // UPLOAD PROFILE PIC (Menggunakan Base64 agar Hemat & Gratis)
    function uploadProfilePic(input) {
      const file = input.files[0];
      const user = auth.currentUser;
      if (!file || !user) return;

      const status = document.getElementById("uploadStatus");
      status.innerText = "Memproses...";
      status.style.color = "var(--primary-color)";

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          // Resize gambar ke 200x200 agar database tetap ringan
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const size = 200;
          canvas.width = size;
          canvas.height = size;

          // Potong gambar jadi kotak tengah (Crop)
          let sourceX = 0, sourceY = 0, sourceSize = img.width;
          if (img.width > img.height) {
            sourceSize = img.height;
            sourceX = (img.width - img.height) / 2;
          } else {
            sourceSize = img.width;
            sourceY = (img.height - img.width) / 2;
          }

          ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, size, size);

          // Konversi ke string Base64 yang dikompres (JPEG 0.7)
          const base64String = canvas.toDataURL('image/jpeg', 0.7);

          // Simpan string ke Realtime Database
          db.ref("users/" + user.uid).update({ profilePic: base64String })
            .then(() => {
              status.innerText = "Selesai!";
              status.style.color = "#10b981";
              setTimeout(() => status.innerText = "", 3000);
            })
            .catch(err => {
              console.error(err);
              status.innerText = "Gagal menyimpan.";
            });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // CHART INITIALIZATION
    Chart.defaults.color = 'var(--secondary-text)';
    const commonOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      }
    };

    const ctxPersen = document.getElementById('persenChart').getContext('2d');
    const gradientPersen = ctxPersen.createLinearGradient(0, 0, 0, 180);
    gradientPersen.addColorStop(0, 'rgba(59, 130, 246, 0.4)');
    gradientPersen.addColorStop(1, 'rgba(59, 130, 246, 0)');

    const persenChart = new Chart(ctxPersen, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Persentase (%)',
          data: [],
          borderColor: '#3b82f6',
          backgroundColor: gradientPersen,
          borderWidth: 3,
          fill: true,
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 5,
        }]
      },
      options: {
        ...commonOptions,
        scales: {
          y: { min: 0, max: 100, grid: { color: 'rgba(107, 114, 128, 0.05)' }, border: { display: false } },
          x: { grid: { display: false }, border: { display: false } }
        }
      }
    });

    const ctxLiter = document.getElementById('literChart').getContext('2d');
    const literChart = new Chart(ctxLiter, {
      type: 'doughnut',
      data: {
        labels: ['Volume Saat Ini', 'Kapasitas Kosong'],
        datasets: [{
          data: [0, 100],
          backgroundColor: ['#3b82f6', 'rgba(107, 114, 128, 0.1)'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '75%',
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12 } }
        }
      }
    });

    const ctxTinggi = document.getElementById('tinggiChart').getContext('2d');
    const tinggiChart = new Chart(ctxTinggi, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [{
          label: 'Tinggi Air (cm)',
          data: [],
          backgroundColor: '#60a5fa',
          borderRadius: 4
        }]
      },
      options: {
        ...commonOptions,
        scales: {
          y: { grid: { color: 'rgba(107, 114, 128, 0.1)' } },
          x: { grid: { display: false } }
        }
      }
    });

    const MAX_POINTS = 10;
    let dataLogs = [];

    // REALTIME DATA
    db.ref("water_tank").on("value", snapshot => {
      let data = snapshot.val();
      if (data) {
        document.getElementById("liter").innerText = data.liter + " L";
        document.getElementById("persen").innerText = data.persen + "%";
        document.getElementById("tinggi").innerText = data.tinggi_air + " cm";
        document.getElementById("status").innerHTML = `<span class="pulse-dot"></span> ${data.status}`;
        document.getElementById("lastUpdate").innerText = now;

        let now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        // Simpan ke Log Lokal untuk Pelaporan
        const logEntry = {
          time: new Date().toLocaleString('id-ID'),
          liter: data.liter,
          persen: data.persen,
          status: data.status
        };
        dataLogs.unshift(logEntry); // Tambah ke awal array
        if (dataLogs.length > 50) dataLogs.pop(); // Batasi 50 log terakhir
        updateLogTable();

        // Update Charts...
        persenChart.data.labels.push(now);
        persenChart.data.datasets[0].data.push(data.persen);
        if (persenChart.data.labels.length > MAX_POINTS) {
          persenChart.data.labels.shift();
          persenChart.data.datasets[0].data.shift();
        }
        persenChart.update();

        let maxVol = (data.persen > 0) ? Math.round(data.liter * 100 / data.persen) : 100;
        let kosong = maxVol - data.liter;
        if (kosong < 0) kosong = 0;
        literChart.data.datasets[0].data = [data.liter, kosong];
        literChart.update();

        tinggiChart.data.labels.push(now);
        tinggiChart.data.datasets[0].data.push(data.tinggi_air);
        if (tinggiChart.data.labels.length > MAX_POINTS) {
          tinggiChart.data.labels.shift();
          tinggiChart.data.datasets[0].data.shift();
        }
        tinggiChart.update();

        // Status Styling
        let statusBadge = document.getElementById("status");
        if (data.status.toUpperCase() === "NORMAL") {
          statusBadge.style.backgroundColor = "rgba(16, 185, 129, 0.1)";
          statusBadge.style.color = "#10b981";
        } else if (data.status.toUpperCase().includes("BAHAYA") || data.status.toUpperCase().includes("FULL")) {
          statusBadge.style.backgroundColor = "rgba(239, 68, 68, 0.1)";
          statusBadge.style.color = "#ef4444";

          // Kirim Email Alert jika sudah melewati masa cooldown
          const nowTime = Date.now();
          if (nowTime - lastEmailSentTime > EMAIL_COOLDOWN) {
            sendEmailAlert(data.status, data.persen, data.liter);
            lastEmailSentTime = nowTime;
          }
        } else {
          statusBadge.style.backgroundColor = "rgba(245, 158, 11, 0.1)";
          statusBadge.style.color = "#f59e0b";
        }
      }
    });

    function updateLogTable() {
      const body = document.getElementById("logBody");
      body.innerHTML = dataLogs.map(log => `
        <tr style="border-bottom: 1px solid var(--border-color);">
          <td style="padding: 12px; font-size: 0.9rem;">${log.time}</td>
          <td style="padding: 12px;">${log.liter}</td>
          <td style="padding: 12px;">${log.persen}%</td>
          <td style="padding: 12px;">
            <span style="font-size: 0.8rem; font-weight: 600; padding: 4px 8px; border-radius: 4px; 
              background: ${log.status === 'NORMAL' ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)'};
              color: ${log.status === 'NORMAL' ? '#10b981' : '#ef4444'};">
              ${log.status}
            </span>
          </td>
        </tr>
      `).join('');
    }

    function exportToCSV() {
      if (dataLogs.length === 0) return alert("Belum ada data untuk diekspor!");

      let csv = "Waktu,Volume (L),Persentase (%),Status\n";
      dataLogs.forEach(log => {
        csv += `${log.time},${log.liter},${log.persen},${log.status}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", "Laporan_Bina_Elektric.csv");
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function sendEmailAlert(status, persen, liter) {
      const user = auth.currentUser;
      if (!user) return;

      const templateParams = {
        to_email: user.email,
        tank_status: status,
        tank_percent: persen,
        tank_liter: liter,
        time: new Date().toLocaleString('id-ID')
      };

      emailjs.send(EMAIL_SERVICE_ID, EMAIL_TEMPLATE_ID, templateParams)
        .then(() => {
          console.log("Email Alert Berhasil Dikirim!");
        }, (error) => {
          console.error("Gagal mengirim email:", error);
        });
    }

    // Theme Chart update
    document.getElementById('themeToggle').addEventListener('click', () => {
      setTimeout(() => {
        let isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        Chart.defaults.color = isDark ? '#94a3b8' : '#6b7280';
        let gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
        if (persenChart.options.scales.y) persenChart.options.scales.y.grid.color = gridColor;
        if (tinggiChart.options.scales.y) tinggiChart.options.scales.y.grid.color = gridColor;
        literChart.data.datasets[0].backgroundColor[1] = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
        persenChart.update();
        literChart.update();
        tinggiChart.update();
      }, 50);
    });
  </script>
</body>

</html>

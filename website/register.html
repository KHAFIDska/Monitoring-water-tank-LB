<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Bina Electric</title>
  <link rel="stylesheet" href="style.css?v=1.1">
  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>

  <!-- Theme Toggle -->
  <div style="position: absolute; top: 20px; right: 20px;">
    <button id="themeToggle" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
      <i data-feather="moon"></i>
    </button>
  </div>

  <main class="login-container">
    <div class="card login-card text-center">
      <!-- Registration Form Container -->
      <div id="registerForm">
        <div class="mb-3">
          <i data-feather="user-plus" style="color: var(--primary-color); width: 48px; height: 48px;"></i>
          <h2 class="mt-3">Daftar Akun</h2>
          <p>Gunakan email asli untuk menerima tautan verifikasi</p>
        </div>

        <div class="form-group text-left">
          <label for="email" class="mb-1 d-block">Alamat Email</label>
          <input type="email" id="email" placeholder="contoh@gmail.com" required>

          <label for="password" class="mb-1 d-block">Kata Sandi</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Minimal 6 karakter" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()"
              aria-label="Toggle password visibility">
              <i id="eyeIcon" data-feather="eye"></i>
            </button>
          </div>
        </div>

        <button onclick="register()" class="mb-2 mt-3 w-100">
          Daftar Sekarang <i data-feather="check-circle"></i>
        </button>

        <div class="mt-3">
          <p class="mb-1">Sudah punya akun?</p>
          <button onclick="window.location.href='index.html'" class="btn-secondary">Kembali ke Login</button>
        </div>
      </div>

      <!-- Success Message Container (Hidden by default) -->
      <div id="successState" style="display: none;">
        <div class="mb-3">
          <div class="success-icon-wrapper mb-3">
            <i data-feather="mail" class="success-icon"></i>
          </div>
          <h2 class="mt-3">Cek Email Anda!</h2>
          <p id="successEmailText" class="mb-4">Kami telah mengirimkan tautan verifikasi ke email Anda.</p>
          
          <div class="alert alert-info mb-4">
            <p><small>Jika tidak ada di inbox, silakan periksa folder <strong>Spam</strong> atau <strong>Promosi</strong>.</small></p>
          </div>
          
          <button onclick="window.location.href='index.html'" class="w-100">
            Lanjut ke Login <i data-feather="arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    feather.replace();

    // Theme logic (Shared with index.html)
    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeIcon('dark');
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
      if (theme === 'dark') {
        themeToggleBtn.innerHTML = '<i data-feather="sun"></i>';
      } else {
        themeToggleBtn.innerHTML = '<i data-feather="moon"></i>';
      }
      feather.replace();
    }

    initTheme();

    // Password Toggle
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('data-feather', 'eye-off');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('data-feather', 'eye');
      }
      feather.replace();
    }
  </script>
</body>

</html>
